[project]
site_name = "bumplot"
site_url = "https://y-sunflower.github.io/bumplot/"
repo_url = "https://github.com/y-sunflower/bumplot"
nav = [
  { Home = "index.md" },
  { Examples = "examples.md" },
  { "Advanced usage" = "advanced-usage.md" },
  { Reference = ["reference/bumplot.md", "reference/bezier.md"] },
  { Contributing = "contributing.md" },
]
extra_css = ["stylesheets/style.css"]

[project.theme]
variant = "classic"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "navigation.path",
  "content.footnote.tooltips",
  "navigation.expand",
]

[project.theme.palette]
primary = "white"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.search]

[project.plugins.markdown-exec]
languages = ["python"]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
heading_level = 3

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.blocks.caption = {}
pymdownx.details = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tilde = {}
