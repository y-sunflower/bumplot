[project]
name = "bumplot"
version = "0.2.1"
description = "Easily create and customize bump charts in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Joseph Barbier", email = "joseph.barbierdarnal@gmail.com" },
]
keywords = ["bezier", "bump", "bump charts", "bump plot", "curve", "data", "matplotlib", "visualization"]
classifiers = ["Development Status :: 5 - Production/Stable", "Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = [
  "matplotlib>=3.9.4",
  "narwhals>=2.0.0",
]

[project.urls]
Documentation = "https://y-sunflower.github.io/bumplot/"
Homepage = "https://y-sunflower.github.io/bumplot/"
Issues = "https://github.com/y-sunflower/bumplot/issues"
Repository = "https://github.com/y-sunflower/bumplot"

[dependency-groups]
dev = [
  "coverage>=7.9.1",
  "genbadge>=1.1.2",
  "markdown-exec>=1.12.3",
  "mkdocstrings-python>=1.16.5",
  "pandas>=2.3.2",
  "polars>=1.32.3",
  "pre-commit>=4.2.0",
  "pyfonts>=1.1.1",
  "pypalettes>=0.1.6",
  "pyrefly>=1.4.0",
  "pytest>=8.3.5",
  "ruff>=0.17.3",
  "ty>=0.0.95",
  "zensical>=0.0.67",
]

[build-system]
requires = [
  "setuptools",
  "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bumplot"]

[tool.uv.sources]
bumplot = { workspace = true }
